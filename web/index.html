<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>TinyScript Compiler UI</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="panel">
    <h1>TinyScript Compiler</h1>
    <textarea id="source" placeholder="Write TinyScript here..."></textarea>
    <div class="controls">
      <button id="compile">Compile & Run</button>
      <button id="download">Download IR</button>
    </div>
    <pre id="output"></pre>
  </div>
  <script src="app.js"></script>
</body>
</html>
